name: Scheduled Notion sync check

# Preview-only: pings the backend to check the configured Notion pages for
# pending changes. Never confirms/writes anything — results just show up as
# a banner on the Upload page next time you open it.
on:
  schedule:
    - cron: "0 22 * * *" # daily 22:00 UTC (~06:00 next day in UTC+8)
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled Notion check
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/v1/notion/scheduled-check" \
            -H "X-Scheduled-Sync-Token: ${{ secrets.SCHEDULED_SYNC_TOKEN }}"
